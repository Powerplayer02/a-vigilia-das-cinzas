[project]
name = "vigilia-das-cinzas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["panda3d>=1.10.16,<1.11", "pygame>=2.6.1,<3", "numpy>=2.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: testes que requerem janela, mixer ou recursos nativos de integração"]
