name: Regras e contratos
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    name: Tests (${{ matrix.os }})
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Domain and contract tests (no window)
        run: python -m pytest tests/ -m "not integration" -q --junitxml=test-results.xml
